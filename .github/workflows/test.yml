name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: zsh -n scripts/build-app.sh scripts/smoke.sh
      - run: plutil -lint Resources/Info.plist Resources/eq.entitlements
